<!DOCTYPE html>
<html>
<head>
    <title>Sumbmit PO here</title>

</head>
<body>
<form action="/submit" method="post">
    <label>
        Name:
        <input type="text" name="name" required>
    </label>
    <label>
        Email:
        <input type="email" name="email" required>
    </label>

    <label>
        Expected Last Day:
        <input type="date" name="expected_last_date" required>
    </label>

    <label>
        Notes:
        <textarea name="notes"></textarea>
    </label>
    

    <button type="submit">Submit</button>
</form>
</body>
</html>
